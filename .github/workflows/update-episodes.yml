# Weekly refresh of _data/episodes.yml from the YouTube playlist feed.
# YouTube is blocked in some sandboxes but fine on GitHub's runners.
name: Update podcast episodes

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/update_episodes.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain _data/episodes.yml assets/images/episodes)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/episodes.yml assets/images/episodes
            git commit -m "Update podcast episodes from YouTube"
            git push
          fi
